#E0A800"/><circle cx="880" cy="116" r="4" fill="#E0A800"/><text x="40" y="42" font-size="14" font-weight="700" fill="#E0A800" text-anchor="start">SENSORE  ·  FACILE</text><text x="40" y="88" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="start">Luce notturna con fotoresistenza</text><text x="40" y="180" font-size="22" font-weight="800" fill="#13202B" text-anchor="start">Componenti</text><circle cx="48" cy="205" r="4" fill="#1650E0"/><text x="64" y="210" font-size="17" font-weight="400" fill="#13202B" text-anchor="start">ESP32 DevKit</text><circle cx="48" cy="235" r="4" fill="#1650E0"/><text x="64" y="240" font-size="17" font-weight="400" fill="#13202B" text-anchor="start">Modulo fotoresistenza analogico a 3 pin (AO)</text><circle cx="48" cy="265" r="4" fill="#1650E0"/><text x="64" y="270" font-size="17" font-weight="400" fill="#13202B" text-anchor="start">LED</text><circle cx="48" cy="295" r="4" fill="#1650E0"/><text x="64" y="300" font-size="17" font-weight="400" fill="#13202B" text-anchor="start">Resistenza da 220 Ω per il LED</text><text x="40" y="356" font-size="22" font-weight="800" fill="#13202B" text-anchor="start">Collegamenti</text><rect x="40" y="378" width="160" height="246" rx="12" fill="#FFFFFF" stroke="#CBD5DC" stroke-width="2"/><text x="120" y="414" font-size="18" font-weight="800" fill="#13202B" text-anchor="middle">ESP32</text><rect x="520" y="378" width="340" height="246" rx="12" fill="#FFFFFF" stroke="#CBD5DC" stroke-width="2"/><text x="690" y="414" font-size="18" font-weight="800" fill="#13202B" text-anchor="middle">Modulo</text><line x1="200" y1="460" x2="520" y2="460" stroke="#D93025" stroke-width="4" stroke-linecap="round"/><circle cx="200" cy="460" r="6" fill="#D93025"/><circle cx="520" cy="460" r="6" fill="#D93025"/><text x="56" y="465" font-size="16" font-weight="700" fill="#13202B" text-anchor="start">3V3</text><text x="540" y="465" font-size="16" font-weight="400" fill="#13202B" text-anchor="start">Sensore VCC</text><line x1="200" y1="504" x2="520" y2="504" stroke="#1650E0" stroke-width="4" stroke-linecap="round"/><circle cx="200" cy="504" r="6" fill="#1650E0"/><circle cx="520" cy="504" r="6" fill="#1650E0"/><text x="56" y="509" font-size="16" font-weight="700" fill="#13202B" text-anchor="start">GPIO 35</text><text x="540" y="509" font-size="16" font-weight="400" fill="#13202B" text-anchor="start">Sensore AO</text><line x1="200" y1="548" x2="520" y2="548" stroke="#52626F" stroke-width="4" stroke-linecap="round"/><circle cx="200" cy="548" r="6" fill="#52626F"/><circle cx="520" cy="548" r="6" fill="#52626F"/><text x="56" y="553" font-size="16" font-weight="700" fill="#13202B" text-anchor="start">GND</text><text x="540" y="553" font-size="16" font-weight="400" fill="#13202B" text-anchor="start">Sensore GND</text><line x1="200" y1="592" x2="520" y2="592" stroke="#1650E0" stroke-width="4" stroke-linecap="round"/><circle cx="200" cy="592" r="6" fill="#1650E0"/><circle cx="520" cy="592" r="6" fill="#1650E0"/><text x="56" y="597" font-size="16" font-weight="700" fill="#13202B" text-anchor="start">GPIO 23</text><text x="540" y="597" font-size="16" font-weight="400" fill="#13202B" text-anchor="start">LED (+) con resistenza</text><rect x="40" y="637" width="22" height="5" rx="2" fill="#D93025"/><text x="68" y="646" font-size="14" font-weight="400" fill="#52626F" text-anchor="start">Alimentazione</text><rect x="190" y="637" width="22" height="5" rx="2" fill="#52626F"/><text x="218" y="646" font-size="14" font-weight="400" fill="#52626F" text-anchor="start">Massa</text><rect x="340" y="637" width="22" height="5" rx="2" fill="#1650E0"/><text x="368" y="646" font-size="14" font-weight="400" fill="#52626F" text-anchor="start">Segnale</text><text x="40" y="696" font-size="22" font-weight="800" fill="#13202B" text-anchor="start">Come funziona</text><rect x="40" y="716" width="230" height="108" rx="10" fill="#FFFFFF" stroke="#CBD5DC" stroke-width="2"/><circle cx="66" cy="744" r="14" fill="#E0A800"/><text x="66" y="750" font-size="16" font-weight="800" fill="#13202B" text-anchor="middle">1</text><text x="90" y="748" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">La fotoresistenza</text><text x="90" y="769" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">misura la luce</text><line x1="278" y1="770" x2="318" y2="770" stroke="#E0A800" stroke-width="4"/><polygon points="328,770 314,762 314,778" fill="#E0A800"/><rect x="335" y="716" width="230" height="108" rx="10" fill="#FFFFFF" stroke="#CBD5DC" stroke-width="2"/><circle cx="361" cy="744" r="14" fill="#E0A800"/><text x="361" y="750" font-size="16" font-weight="800" fill="#13202B" text-anchor="middle">2</text><text x="385" y="748" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">Valore sotto la</text><text x="385" y="769" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">soglia?</text><line x1="573" y1="770" x2="613" y2="770" stroke="#E0A800" stroke-width="4"/><polygon points="623,770 609,762 609,778" fill="#E0A800"/><rect x="630" y="716" width="230" height="108" rx="10" fill="#FFFFFF" stroke="#CBD5DC" stroke-width="2"/><circle cx="656" cy="744" r="14" fill="#E0A800"/><text x="656" y="750" font-size="16" font-weight="800" fill="#13202B" text-anchor="middle">3</text><text x="680" y="748" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">Il LED si accende</text><text x="40" y="880" font-size="22" font-weight="800" fill="#13202B" text-anchor="start">Nota</text><rect x="40" y="896" width="5" height="50" fill="#E0A800"/><text x="62" y="916" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">Usa un pin ADC1 come il GPIO 35. Alcuni moduli danno un valore più alto con più luce,</text><text x="62" y="939" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">altri il contrario: stampa il valore sul monitor seriale e regola la soglia BUIO.</text><text x="40" y="1002" font-size="13" font-weight="400" fill="#52626F" text-anchor="start">Progetti ESP32 con sensori e attuatori Arduino</text></svg>