#E0A800"/><circle cx="880" cy="116" r="4" fill="#E0A800"/><text x="40" y="42" font-size="14" font-weight="700" fill="#E0A800" text-anchor="start">ATTUATORE  ·  MEDIO</text><text x="40" y="88" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="start">Barriera automatica con servo</text><text x="40" y="180" font-size="22" font-weight="800" fill="#13202B" text-anchor="start">Componenti</text><circle cx="48" cy="205" r="4" fill="#1650E0"/><text x="64" y="210" font-size="17" font-weight="400" fill="#13202B" text-anchor="start">ESP32 DevKit</text><circle cx="48" cy="235" r="4" fill="#1650E0"/><text x="64" y="240" font-size="17" font-weight="400" fill="#13202B" text-anchor="start">Sensore HC-SR04</text><circle cx="48" cy="265" r="4" fill="#1650E0"/><text x="64" y="270" font-size="17" font-weight="400" fill="#13202B" text-anchor="start">Servo SG90</text><circle cx="48" cy="295" r="4" fill="#1650E0"/><text x="64" y="300" font-size="17" font-weight="400" fill="#13202B" text-anchor="start">2 resistenze (1 kΩ e 2 kΩ)</text><circle cx="48" cy="325" r="4" fill="#1650E0"/><text x="64" y="330" font-size="17" font-weight="400" fill="#13202B" text-anchor="start">Libreria ESP32Servo</text><text x="40" y="386" font-size="22" font-weight="800" fill="#13202B" text-anchor="start">Collegamenti</text><rect x="40" y="408" width="160" height="246" rx="12" fill="#FFFFFF" stroke="#CBD5DC" stroke-width="2"/><text x="120" y="444" font-size="18" font-weight="800" fill="#13202B" text-anchor="middle">ESP32</text><rect x="520" y="408" width="340" height="246" rx="12" fill="#FFFFFF" stroke="#CBD5DC" stroke-width="2"/><text x="690" y="444" font-size="18" font-weight="800" fill="#13202B" text-anchor="middle">Modulo</text><line x1="200" y1="490" x2="520" y2="490" stroke="#1650E0" stroke-width="4" stroke-linecap="round"/><circle cx="200" cy="490" r="6" fill="#1650E0"/><circle cx="520" cy="490" r="6" fill="#1650E0"/><text x="56" y="495" font-size="16" font-weight="700" fill="#13202B" text-anchor="start">GPIO 5</text><text x="540" y="495" font-size="16" font-weight="400" fill="#13202B" text-anchor="start">TRIG</text><line x1="200" y1="534" x2="520" y2="534" stroke="#1650E0" stroke-width="4" stroke-linecap="round"/><circle cx="200" cy="534" r="6" fill="#1650E0"/><circle cx="520" cy="534" r="6" fill="#1650E0"/><text x="56" y="539" font-size="16" font-weight="700" fill="#13202B" text-anchor="start">GPIO 18</text><text x="540" y="539" font-size="16" font-weight="400" fill="#13202B" text-anchor="start">ECHO (con partitore)</text><line x1="200" y1="578" x2="520" y2="578" stroke="#1650E0" stroke-width="4" stroke-linecap="round"/><circle cx="200" cy="578" r="6" fill="#1650E0"/><circle cx="520" cy="578" r="6" fill="#1650E0"/><text x="56" y="583" font-size="16" font-weight="700" fill="#13202B" text-anchor="start">GPIO 13</text><text x="540" y="583" font-size="16" font-weight="400" fill="#13202B" text-anchor="start">Servo segnale</text><line x1="200" y1="622" x2="520" y2="622" stroke="#D93025" stroke-width="4" stroke-linecap="round"/><circle cx="200" cy="622" r="6" fill="#D93025"/><circle cx="520" cy="622" r="6" fill="#D93025"/><text x="56" y="627" font-size="16" font-weight="700" fill="#13202B" text-anchor="start">VIN</text><text x="540" y="627" font-size="16" font-weight="400" fill="#13202B" text-anchor="start">HC-SR04 e servo VCC</text><rect x="40" y="667" width="22" height="5" rx="2" fill="#D93025"/><text x="68" y="676" font-size="14" font-weight="400" fill="#52626F" text-anchor="start">Alimentazione</text><rect x="190" y="667" width="22" height="5" rx="2" fill="#52626F"/><text x="218" y="676" font-size="14" font-weight="400" fill="#52626F" text-anchor="start">Massa</text><rect x="340" y="667" width="22" height="5" rx="2" fill="#1650E0"/><text x="368" y="676" font-size="14" font-weight="400" fill="#52626F" text-anchor="start">Segnale</text><text x="40" y="726" font-size="22" font-weight="800" fill="#13202B" text-anchor="start">Come funziona</text><rect x="40" y="746" width="230" height="108" rx="10" fill="#FFFFFF" stroke="#CBD5DC" stroke-width="2"/><circle cx="66" cy="774" r="14" fill="#E0A800"/><text x="66" y="780" font-size="16" font-weight="800" fill="#13202B" text-anchor="middle">1</text><text x="90" y="778" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">L’HC-SR04 misura la</text><text x="90" y="799" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">distanza</text><line x1="278" y1="800" x2="318" y2="800" stroke="#E0A800" stroke-width="4"/><polygon points="328,800 314,792 314,808" fill="#E0A800"/><rect x="335" y="746" width="230" height="108" rx="10" fill="#FFFFFF" stroke="#CBD5DC" stroke-width="2"/><circle cx="361" cy="774" r="14" fill="#E0A800"/><text x="361" y="780" font-size="16" font-weight="800" fill="#13202B" text-anchor="middle">2</text><text x="385" y="778" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">Sotto i 15 cm?</text><line x1="573" y1="800" x2="613" y2="800" stroke="#E0A800" stroke-width="4"/><polygon points="623,800 609,792 609,808" fill="#E0A800"/><rect x="630" y="746" width="230" height="108" rx="10" fill="#FFFFFF" stroke="#CBD5DC" stroke-width="2"/><circle cx="656" cy="774" r="14" fill="#E0A800"/><text x="656" y="780" font-size="16" font-weight="800" fill="#13202B" text-anchor="middle">3</text><text x="680" y="778" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">Il servo alza la</text><text x="680" y="799" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">barriera</text><text x="40" y="910" font-size="22" font-weight="800" fill="#13202B" text-anchor="start">Nota</text><rect x="40" y="926" width="5" height="73" fill="#E0A800"/><text x="62" y="946" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">L’uscita ECHO dell’HC-SR04 è a 5 V: abbassala a circa 3,3 V con un partitore (1 kΩ</text><text x="62" y="969" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">verso il pin, 2 kΩ verso GND). Se il servo fa riavviare la scheda, alimentalo con una</text><text x="62" y="992" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">fonte da 5 V separata e unisci le masse.</text><text x="40" y="1055" font-size="13" font-weight="400" fill="#52626F" text-anchor="start">Progetti ESP32 con sensori e attuatori Arduino</text></svg>