xt x="56" y="479" font-size="16" font-weight="700" fill="#13202B" text-anchor="start">GPIO 27</text><text x="540" y="479" font-size="16" font-weight="400" fill="#13202B" text-anchor="start">PIR OUT</text><line x1="200" y1="518" x2="520" y2="518" stroke="#1650E0" stroke-width="4" stroke-linecap="round"/><circle cx="200" cy="518" r="6" fill="#1650E0"/><circle cx="520" cy="518" r="6" fill="#1650E0"/><text x="56" y="523" font-size="16" font-weight="700" fill="#13202B" text-anchor="start">GPIO 25</text><text x="540" y="523" font-size="16" font-weight="400" fill="#13202B" text-anchor="start">Buzzer +</text><line x1="200" y1="562" x2="520" y2="562" stroke="#52626F" stroke-width="4" stroke-linecap="round"/><circle cx="200" cy="562" r="6" fill="#52626F"/><circle cx="520" cy="562" r="6" fill="#52626F"/><text x="56" y="567" font-size="16" font-weight="700" fill="#13202B" text-anchor="start">GND</text><text x="540" y="567" font-size="16" font-weight="400" fill="#13202B" text-anchor="start">GND</text><rect x="40" y="607" width="22" height="5" rx="2" fill="#D93025"/><text x="68" y="616" font-size="14" font-weight="400" fill="#52626F" text-anchor="start">Alimentazione</text><rect x="190" y="607" width="22" height="5" rx="2" fill="#52626F"/><text x="218" y="616" font-size="14" font-weight="400" fill="#52626F" text-anchor="start">Massa</text><rect x="340" y="607" width="22" height="5" rx="2" fill="#1650E0"/><text x="368" y="616" font-size="14" font-weight="400" fill="#52626F" text-anchor="start">Segnale</text><text x="40" y="666" font-size="22" font-weight="800" fill="#13202B" text-anchor="start">Come funziona</text><rect x="40" y="686" width="230" height="108" rx="10" fill="#FFFFFF" stroke="#CBD5DC" stroke-width="2"/><circle cx="66" cy="714" r="14" fill="#E0A800"/><text x="66" y="720" font-size="16" font-weight="800" fill="#13202B" text-anchor="middle">1</text><text x="90" y="718" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">Il PIR rileva un</text><text x="90" y="739" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">movimento</text><line x1="278" y1="740" x2="318" y2="740" stroke="#E0A800" stroke-width="4"/><polygon points="328,740 314,732 314,748" fill="#E0A800"/><rect x="335" y="686" width="230" height="108" rx="10" fill="#FFFFFF" stroke="#CBD5DC" stroke-width="2"/><circle cx="361" cy="714" r="14" fill="#E0A800"/><text x="361" y="720" font-size="16" font-weight="800" fill="#13202B" text-anchor="middle">2</text><text x="385" y="718" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">L’ESP32 legge il pin</text><line x1="573" y1="740" x2="613" y2="740" stroke="#E0A800" stroke-width="4"/><polygon points="623,740 609,732 609,748" fill="#E0A800"/><rect x="630" y="686" width="230" height="108" rx="10" fill="#FFFFFF" stroke="#CBD5DC" stroke-width="2"/><circle cx="656" cy="714" r="14" fill="#E0A800"/><text x="656" y="720" font-size="16" font-weight="800" fill="#13202B" text-anchor="middle">3</text><text x="680" y="718" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">Il buzzer suona per</text><text x="680" y="739" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">3 secondi</text><text x="40" y="850" font-size="22" font-weight="800" fill="#13202B" text-anchor="start">Nota</text><rect x="40" y="866" width="5" height="50" fill="#E0A800"/><text x="62" y="886" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">Il PIR ha bisogno di circa 30 secondi dopo l’accensione per stabilizzarsi. L’uscita è</text><text x="62" y="909" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">a 3,3 V, quindi va bene per l’ESP32.</text><text x="40" y="972" font-size="13" font-weight="400" fill="#52626F" text-anchor="start">Progetti ESP32 con sensori e attuatori Arduino</text></svg>