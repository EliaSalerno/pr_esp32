A800"/><circle cx="880" cy="116" r="4" fill="#E0A800"/><text x="40" y="42" font-size="14" font-weight="700" fill="#E0A800" text-anchor="start">SENSORE  ·  FACILE</text><text x="40" y="88" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="start">Temperatura e umidità sul web</text><text x="40" y="180" font-size="22" font-weight="800" fill="#13202B" text-anchor="start">Componenti</text><circle cx="48" cy="205" r="4" fill="#1650E0"/><text x="64" y="210" font-size="17" font-weight="400" fill="#13202B" text-anchor="start">ESP32 DevKit</text><circle cx="48" cy="235" r="4" fill="#1650E0"/><text x="64" y="240" font-size="17" font-weight="400" fill="#13202B" text-anchor="start">Modulo sensore DHT11 a 3 pin (VCC, DATA, GND)</text><circle cx="48" cy="265" r="4" fill="#1650E0"/><text x="64" y="270" font-size="17" font-weight="400" fill="#13202B" text-anchor="start">Libreria “DHT sensor library” di Adafruit</text><text x="40" y="326" font-size="22" font-weight="800" fill="#13202B" text-anchor="start">Collegamenti</text><rect x="40" y="348" width="160" height="202" rx="12" fill="#FFFFFF" stroke="#CBD5DC" stroke-width="2"/><text x="120" y="384" font-size="18" font-weight="800" fill="#13202B" text-anchor="middle">ESP32</text><rect x="520" y="348" width="340" height="202" rx="12" fill="#FFFFFF" stroke="#CBD5DC" stroke-width="2"/><text x="690" y="384" font-size="18" font-weight="800" fill="#13202B" text-anchor="middle">Modulo</text><line x1="200" y1="430" x2="520" y2="430" stroke="#D93025" stroke-width="4" stroke-linecap="round"/><circle cx="200" cy="430" r="6" fill="#D93025"/><circle cx="520" cy="430" r="6" fill="#D93025"/><text x="56" y="435" font-size="16" font-weight="700" fill="#13202B" text-anchor="start">3V3</text><text x="540" y="435" font-size="16" font-weight="400" fill="#13202B" text-anchor="start">VCC</text><line x1="200" y1="474" x2="520" y2="474" stroke="#1650E0" stroke-width="4" stroke-linecap="round"/><circle cx="200" cy="474" r="6" fill="#1650E0"/><circle cx="520" cy="474" r="6" fill="#1650E0"/><text x="56" y="479" font-size="16" font-weight="700" fill="#13202B" text-anchor="start">GPIO 4</text><text x="540" y="479" font-size="16" font-weight="400" fill="#13202B" text-anchor="start">DATA</text><line x1="200" y1="518" x2="520" y2="518" stroke="#52626F" stroke-width="4" stroke-linecap="round"/><circle cx="200" cy="518" r="6" fill="#52626F"/><circle cx="520" cy="518" r="6" fill="#52626F"/><text x="56" y="523" font-size="16" font-weight="700" fill="#13202B" text-anchor="start">GND</text><text x="540" y="523" font-size="16" font-weight="400" fill="#13202B" text-anchor="start">GND</text><rect x="40" y="563" width="22" height="5" rx="2" fill="#D93025"/><text x="68" y="572" font-size="14" font-weight="400" fill="#52626F" text-anchor="start">Alimentazione</text><rect x="190" y="563" width="22" height="5" rx="2" fill="#52626F"/><text x="218" y="572" font-size="14" font-weight="400" fill="#52626F" text-anchor="start">Massa</text><rect x="340" y="563" width="22" height="5" rx="2" fill="#1650E0"/><text x="368" y="572" font-size="14" font-weight="400" fill="#52626F" text-anchor="start">Segnale</text><text x="40" y="622" font-size="22" font-weight="800" fill="#13202B" text-anchor="start">Come funziona</text><rect x="40" y="642" width="230" height="108" rx="10" fill="#FFFFFF" stroke="#CBD5DC" stroke-width="2"/><circle cx="66" cy="670" r="14" fill="#E0A800"/><text x="66" y="676" font-size="16" font-weight="800" fill="#13202B" text-anchor="middle">1</text><text x="90" y="674" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">Il DHT11 misura</text><text x="90" y="695" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">temperatura e</text><text x="90" y="716" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">umidità</text><line x1="278" y1="696" x2="318" y2="696" stroke="#E0A800" stroke-width="4"/><polygon points="328,696 314,688 314,704" fill="#E0A800"/><rect x="335" y="642" width="230" height="108" rx="10" fill="#FFFFFF" stroke="#CBD5DC" stroke-width="2"/><circle cx="361" cy="670" r="14" fill="#E0A800"/><text x="361" y="676" font-size="16" font-weight="800" fill="#13202B" text-anchor="middle">2</text><text x="385" y="674" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">L’ESP32 legge il</text><text x="385" y="695" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">dato e crea la</text><text x="385" y="716" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">pagina</text><line x1="573" y1="696" x2="613" y2="696" stroke="#E0A800" stroke-width="4"/><polygon points="623,696 609,688 609,704" fill="#E0A800"/><rect x="630" y="642" width="230" height="108" rx="10" fill="#FFFFFF" stroke="#CBD5DC" stroke-width="2"/><circle cx="656" cy="670" r="14" fill="#E0A800"/><text x="656" y="676" font-size="16" font-weight="800" fill="#13202B" text-anchor="middle">3</text><text x="680" y="674" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">Il browser mostra °C</text><text x="680" y="695" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">e %</text><text x="40" y="806" font-size="22" font-weight="800" fill="#13202B" text-anchor="start">Nota</text><rect x="40" y="822" width="5" height="73" fill="#E0A800"/><text x="62" y="842" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">Il modulo a 3 pin ha già la resistenza di pull-up, quindi non serve altro. Il DHT11</text><text x="62" y="865" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">misura da 0 a 50 °C con precisione di ±2 °C e l’umidità tra 20 e 80 %. Leggilo al</text><text x="62" y="888" font-size="15" font-weight="400" fill="#13202B" text-anchor="start">massimo una volta al secondo.</text><text x="40" y="951" font-size="13" font-weight="400" fill="#52626F" text-anchor="start">Progetti ESP32 con sensori e attuatori Arduino</text></svg>